[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remote-gateway"
version = "0.1.0"
description = "Cloudflare Tunnel gateway for colab-proxy-mcp, modal-gpu, nlm-v2"
requires-python = ">=3.10"
dependencies = [
    "starlette>=0.27.0",
    "httpx>=0.24.0",
    "uvicorn>=0.20.0",
]

[project.scripts]
remote-gateway = "gateway.server:main"
